name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a branch).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pest:
    name: Pest (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Extensions the app needs at boot/test time: sodium (paragonie/paseto),
      # gd (intervention/image, Filament), intl/zip, and pdo_sqlite for the
      # in-memory test database (see phpunit.xml). No MySQL service is required.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, ctype, fileinfo, pdo_sqlite, sqlite3, gd, bcmath, intl, zip, curl, sodium, exif, pcntl
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-

      # .env must exist before install: composer's post-autoload-dump runs
      # artisan (package:discover, filament:upgrade), which boots the app.
      - name: Prepare environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate application key
        run: php artisan key:generate

      # The suite stubs Vite (tests/TestCase.php calls withoutVite) and uses an
      # in-memory SQLite DB with RefreshDatabase, so no frontend build or DB
      # migration step is needed here.
      - name: Run tests
        run: php artisan test
